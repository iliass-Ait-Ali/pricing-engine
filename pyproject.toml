[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-engine"
version = "1.0.0"
description = "AI Pricing & Revenue Optimization Engine on Dominick's Finer Foods retail scanner data (Cereals)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio project" }]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "joblib>=1.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.6", "httpx>=0.27"]
dashboard = ["streamlit>=1.33"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: test requires the processed Dominick's dataset to exist locally",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
